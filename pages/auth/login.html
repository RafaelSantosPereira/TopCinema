<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TopCinema</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    
    <div class="login_create">
        <div class="div_label">
            <h2 class="label_login">Login</h2>
        </div>
        
        <form>
           <input type="email" class="txt" name="Nome" id="nome" placeholder="email">
           <input type="password" class="txtpass" name="Password" id="password" placeholder="Password">
           <button type="submit" name="acao" value="Login" class="LOGIN">Log In</button>
        </form>
        <a href="./create.html" class="link_criar">Create Account</a>
    </div>

    <script type="module" src="./login.js"></script>

</body>
</html>
