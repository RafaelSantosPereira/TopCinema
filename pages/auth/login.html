<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TopCinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    
    <div class="auth-container">
        <a href="../../index.html" class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                <path d="m12.296 3.464 3.02 3.956"/>
                <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/>
                <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <path d="m6.18 5.276 3.1 3.899"/>
            </svg>
            <span class="logo-text">TopCinema</span>
        </a>

        <div class="login_create">
            <h2 class="label_login" data-i18n="sign_in">Login</h2>
            
            <div id="auth-error" class="auth-error hidden" role="alert"></div>

            <form>
               <input type="email" class="txt" name="Nome" id="nome" placeholder="Email" autocomplete="email" required data-i18n-placeholder="email_label">
               <input type="password" class="txtpass" name="Password" id="password" placeholder="Password" autocomplete="current-password" required data-i18n-placeholder="password_label">
               <button type="submit" name="acao" value="Login" class="LOGIN" data-i18n="login_btn">Log In</button>
            </form>

            <div class="auth-divider">
                <span data-i18n="auth_divider_or">OR</span>
            </div>

            <button type="button" class="btn-google" id="btn-google">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span data-i18n="continue_with_google">Continue with Google</span>
            </button>
            <p class="auth-switch"><span data-i18n="no_account_prompt">Don't have an account?</span> <a href="./create.html" class="auth-link" data-i18n="sign_up">Sign Up</a></p>
        </div>
    </div>

    <script type="module" src="./login.js"></script>

</body>
</html>
