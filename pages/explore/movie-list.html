<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TopCinema - Explore</title>
        <meta name="title" content="TopCinema">
        <meta name="description" content="TopCinema is a catalog app for the world of Cinema.">      

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
        <script src="https://c.webfontfree.com/c.js?f=NimbusSanL-Regu" type="text/javascript"></script>
        <script src="https://c.webfontfree.com/c.js?f=Heebo-Regular" type="text/javascript"></script>
        <link rel="stylesheet" href="../../assets/css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
        
        <script src="./movie-list.js" type="module"></script>
    </head>
        <body>
            <!--HEADER-->     
                <header class="header">
                    <a href="../../index.html" class="logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                            <path d="m12.296 3.464 3.02 3.956"/>
                            <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/>
                            <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <path d="m6.18 5.276 3.1 3.899"/>
                        </svg>
                        <span class="logo-text">TopCinema</span>
                    </a>
                    <!-- search-->
                    <div class="search-box" search-box>
                        <div class="search-wrapper" search-wrapper>
                            <input type="text" name="search" placeholder="search" aria-label="search" class="search-field" autocomplete="off">

                            <img src="../../assets/images/search.png" width="24" height="24" alt="search" class="leading-icon">
                        </div>
                        
                        <button class="search-btn" search toggler menu-close>
                            <img src="../../assets/images/search.png" width="24" height="24" alt="open search box">
                        </button>                        
                    </div>
                    <button class="user-btn" aria-label="User profile">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
                            <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
                        </svg>
                    </button>        
                    <div id="account-popup" class="hidden">
                        <div id="account-content"></div>
                    </div>
                </header>

            <div class="cont">
                  <!--Side bar-->
                <nav class="genre-sidebar" side-bar>
                    <p class="title">Genres</p>
                    <button class="genre-bt" value="28" id="btAction">Action</button>
                    <button class="genre-bt" value="12" id="btAdventure">Adventure</button>
                    <button class="genre-bt" value="16">Animation</button>
                    <button class="genre-bt" value="18">Drama</button>
                    <button class="genre-bt" value="10749" id="btRomance">Romance</button>
                    <button class="genre-bt" value="80">Crime</button>
                    <button class="genre-bt" value="35">Comedy</button>
                    <button class="genre-bt" value="878" id="btScience">Science Fiction</button>
                    <button class="genre-bt" value="14" id="btFantasy">Fantasy</button>
                    <button class="genre-bt" value="99">Documentary</button>
                    <button class="genre-bt" value="36">History</button>
                    <button class="genre-bt" value="53" id="btThriller">Thriller</button>
                    <button class="genre-bt" value="27" id="btHorror">Horror</button>
                    <button class="genre-bt" value="37">Western</button>
                    <button class="genre-bt" value="10752" id="btWar">War</button>
                </nav>
                <div class="list-box">
                    <div class="filters">
                        <select class="select" id="type">
                            <option value="movies">Movies</option>
                            <option value="series">Series</option>
                            <option value="anime">Anime</option>
                        </select>
                        <select class="select" id="sort">
                            <option value="trending">Trending</option>
                            <option value="popularity.desc" selected>Popular</option>                              
                            <option value="vote_average.desc">Top Rating</option>
                            <option value="primary_release_date.desc">New</option>
                        </select>
                        <div class="filter-extra" id="filter-extra">
                            <select class="select" id="provider">
                                <option value="all">all providers</option>
                                <option value="8">Netflix</option>
                                <option value="9">Amazon PRIME</option>
                                <option value="1899">HBO MAX</option>
                                <option value="350">Aple TV+</option>
                                <option value="337">Disney+</option>                              
                            </select>
                            
                            <div class="checkAnimation">
                                <input type="checkbox" id="customCheckbox" />
                                <label for="customCheckbox">exclude animations</label>
                            </div>
                        </div>
                    </div>
                    <article class="container" page-content>             
                        <div class="grid-list" id="grid-list"></div>
                    </article>
                </div>
            </div>
        </body>
</html>
