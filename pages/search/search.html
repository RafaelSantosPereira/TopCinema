<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TopCinema - Search</title>
        <meta name="title" content="TopCinema">
        <meta name="description" content="TopCinema is a catalog app for the world of Cinema.">      
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
        <script src="https://c.webfontfree.com/c.js?f=NimbusSanL-Regu" type="text/javascript"></script>
        <script src="https://c.webfontfree.com/c.js?f=Heebo-Regular" type="text/javascript"></script>
        <link rel="stylesheet" href="../../assets/css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
        <script src="./search.js" type="module"></script>
    </head>
        <body>
            <!--HEADER-->     
                <header class="header">
                    <a href="../../index.html" class="logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                            <path d="m12.296 3.464 3.02 3.956"/>
                            <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/>
                            <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <path d="m6.18 5.276 3.1 3.899"/>
                        </svg>
                        <span class="logo-text">TopCinema</span>
                    </a>
                    <!-- search-->
                    <div class="search-box" search-box>
                        <div class="search-wrapper" search-wrapper>
                            <input type="text" name="search" placeholder="search" aria-label="search" class="search-field" id="search-bar" autocomplete="off">

                            <img src="../../assets/images/search.png" width="24" height="24" alt="search" class="leading-icon">
                        </div>
                        
                        <button class="search-btn" id="search-btn" search toggler menu-close>
                            <img src="../../assets/images/search.png" width="24" height="24" alt="open search box">
                        </button>                        
                    </div>
                    <button class="user-btn" aria-label="User profile">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
                            <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
                        </svg>
                    </button>        
                    <div id="account-popup" class="hidden">
                        <div id="account-content"></div>
                    </div>
                </header>
            <!--Side bar-->
            <main>
                <div class="cont">
                    <nav class="side-bar" side-bar>
                        <ul>
                            <li class="menu-item">
                                <a href="../../index.html">
                                    <span class="icon"><i class="bi bi-house"></i></span>
                                    <span class="txt-link">Home</span>
                                </a>
                            </li>

                            <li class="menu-item">
                                <a href="../library/library.html">
                                    <span class="icon"><i class="bi bi-collection"></i></span>
                                    <span class="txt-link">Library</span>
                                </a>
                            </li>
                            <li class="menu-item">
                                <a href="../explore/movie-list.html" class="base-list">
                                    <span class="icon"><i class="bi bi-compass"></i></span>
                                    <span class="txt-link">Explore</span>
                                </a>
                            </li>        
                        </ul>
                    </nav>
        
                    <!--content-->
                    <article class="container search-container" page-content>
                        <section class="list" id="list" aria-label="popular movies">
                            <div id="movie-container">
                                <div class="title-wrapper" id="title-wrapper">
                                    <h3 class="title-large">Movies</h3>
                                </div>
                                <div class="slider-list" id="slider-list">
                                    <i class="bi bi-chevron-left left"></i>
                                    <div class="slider-inner" id="slider-inner"></div>
                                    <i id="right" class="bi bi-chevron-right right"></i>
                                </div>
                            </div>
                            
                            <div id="series-container">
                                <div class="title-wrapper" id="title-wrapper-series">
                                    <h3 class="title-large">Series</h3>
                                </div>
                                <div class="slider-list2" id="slider-list2">
                                    <i class="bi bi-chevron-left left"></i>
                                    <div class="slider-inner2" id="slider-inner2"></div>
                                    <i id="right-series" class="bi bi-chevron-right right"></i>
                                </div>
                            </div>
                        </section>

                        <!-- FOOTER -->
                        <footer class="footer">
                          <div class="footer-container">
                            <div class="footer-brand">
                              <div class="footer-logo">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                                    <path d="m12.296 3.464 3.02 3.956"/>
                                    <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/>
                                    <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                    <path d="m6.18 5.276 3.1 3.899"/>
                                </svg>
                                <span class="footer-title">TopCinema</span>
                              </div>
                              <p class="copyright-text">
                                &copy; 2026 TopCinema. All rights reserved.<br>
                                Developed by <span class="author-name">Rafael Pereira</span>
                              </p>
                            </div>

                            <div class="footer-nav">
                              <p class="footer-heading">Navigation</p>
                              <ul class="footer-links">
                                <li><a href="../../index.html">Home</a></li>
                                <li><a href="../explore/movie-list.html">Explore</a></li>
                                <li><a href="../library/library.html">Library</a></li>
                              </ul>
                            </div>

                            <div class="footer-tmdb">
                              <img src="../../assets/images/tmdb-logo.svg" width="110" alt="TMDB Logo" class="tmdb-logo">
                              <p class="tmdb-disclaimer">
                                This product uses the TMDB API but is not endorsed or certified by TMDB.
                              </p>
                            </div>
                          </div>
                        </footer>
                    </article>
                </div>
            </main>
        </body>
</html>
